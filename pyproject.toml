[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Enterprise RAG architecture scaffold; implementation pending"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.7,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "PyJWT[crypto]>=2.10,<3",
    "pymongo>=4.13,<5",
    "minio>=7.2,<8",
    "urllib3>=2,<3",
    "anyio>=4,<5",
    "python-multipart>=0.0.20,<1",
    "argon2-cffi>=25.1,<26",
    "email-validator>=2,<3",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
