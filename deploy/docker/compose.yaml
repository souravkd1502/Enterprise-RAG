# Local development only: published ports are bound to loopback.
name: enterprise-rag-local

x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  mongodb:
    <<: *defaults
    image: mongo:8.0.34
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./mongodb-init.js:/opt/rag/mongodb-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--file", "/opt/rag/mongodb-init.js"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  chromadb:
    <<: *defaults
    image: chromadb/chroma:1.5.3
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - chromadb_data:/data

  minio:
    <<: *defaults
    image: enterprise-rag-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: .
      dockerfile: Minio.Dockerfile
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in the Compose env file}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the Compose env file}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--output", "/dev/null", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *defaults
    image: redis:8.6.7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    <<: *defaults
    image: rabbitmq:4.3.6-management-alpine
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in the Compose env file}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in the Compose env file}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

volumes:
  mongodb_data:
  chromadb_data:
  minio_data:
  redis_data:
  rabbitmq_data:
